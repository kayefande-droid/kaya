plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Versioning follows pubspec.yaml via the flutter tool's local.properties
// (flutter.versionName / flutter.versionCode), so the in-app updater's
// current-vs-latest comparison is always accurate.
// versionCode = 2000 + pubspec build number (1.1.7+13→2013, 1.1.8+14→2014,
// 1.1.9+15→2015): monotonic across versionName bumps, and never collides
// with the raw build numbers the flutter tool writes into local.properties.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { localProperties.load(it) }
}

// Release signing: reads key.properties (gitignored). When absent (e.g. a
// fork's CI without secrets), falls back to debug signing so builds never break.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.kaya.booster"
    compileSdk = 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.kaya.booster"
        minSdk = 26
        targetSdk = 34
        versionCode = 2000 + (localProperties.getProperty("flutter.versionCode")?.toInteger() ?: 0)
        versionName = localProperties.getProperty("flutter.versionName") ?: "1.0.0"
        ndkVersion = "28.2.13676358"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = signingConfigs.debug
            }
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
}
