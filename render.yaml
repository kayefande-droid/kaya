services:
  # Render Blueprint — deploy with: Render dashboard → New + → Blueprint →
  # point it at github.com/kayefande-droid/kaya and it picks this file up.
  - type: web
    name: kaya-booster
    runtime: static
    rootDir: site
    buildCommand: echo "static site - nothing to build"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /
        destination: /index.html
